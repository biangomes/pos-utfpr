<div class="container">
    <div class="alert alert-success" role="alert">
        Cantor adicionado: <strong>{{nomeInserido}}</strong>
    </div>
    
    <div class="form-group">
        <label>Nome</label>
        <input type="text" class="form-control" #nomeInput 
        (input)="alterarNome($event)" [value]="nome">
    </div>
    
    <button type="button" class="btn btn-primary" 
    (click)="adicionar(nomeInput.value)" [disabled]="nome.length == 0">
        Adicionar
    </button>
</div>

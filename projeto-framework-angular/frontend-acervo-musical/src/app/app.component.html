<div class="container">
    <div class="alert alert-success" role="alert">
        Cantor adicionado: <strong>{{nome}}</strong>
    </div>
    
    <div class="form-group">
        <label>Nome</label>
        <input type="text" class="form-control"
        [(ngModel)]="nome">
    </div>
    
    <button type="button" class="btn btn-primary" 
    (click)="adicionar()" [disabled]="nome.length == 0">
        Adicionar
    </button>

    <div class="row" style="margin-top: 20px">

        <div class="col-md-2" *ngFor="let c of cantores">
            <app-cantor-card [cantor]="c"></app-cantor-card>
        </div>
    </div>

</div>
